<app-header></app-header>
<div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 150px">
        <h1 class="font-weight-semi-bold text-uppercase mb-3">Checkout</h1>
        <div class="d-inline-flex">
            <p class="m-0"><a href="">Home</a></p>
            <p class="m-0 px-2">-</p>
            <p class="m-0">Checkout</p>
        </div>
    </div>
</div>

<div class="show-msg" style="background-color: none;" [innerHTML]="target"></div>
<form class="container-fluid pt-5"  (ngSubmit)="onSubmitcheckoutForm()">
    <div class="row px-xl-5">
        <div class="col-lg-8">
            <div class="mb-4">
                <h4 class="font-weight-semi-bold mb-4">Billing Address</h4>
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>Name</label>
                        <input class="form-control" name="name"  [(ngModel)]="name" type="text" placeholder="John">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>E-mail</label>
                        <input class="form-control" name="email"  [(ngModel)]="email" type="text" placeholder="example@email.com">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Mobile No</label>
                        <input class="form-control" name="contact" [(ngModel)]="contact" type="text" placeholder="+123 456 789">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Address Line 1</label>
                        <input class="form-control" name="address1" [(ngModel)]="address1" type="text" placeholder="123 Street">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Address Line 2</label>
                        <input class="form-control" name="address2" [(ngModel)]="address2" type="text" placeholder="123 Street">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Country</label>
                        <select class="custom-select" name="country" [(ngModel)]="country">
                            <option selected>United States</option>
                            <option>Afghanistan</option>
                            <option>Albania</option>
                            <option>Algeria</option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>City</label>
                        <input class="form-control" name="city" [(ngModel)]="city" type="text" placeholder="New York">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>State</label>
                        <input class="form-control" name="state" [(ngModel)]="state" type="text" placeholder="New York">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>ZIP Code</label>
                        <input class="form-control" name="zip" [(ngModel)]="zip" type="text" placeholder="123">
                    </div>
                    <!-- <div class="col-md-12 form-group">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="newaccount">
                            <label class="custom-control-label" for="newaccount">Create an account</label>
                        </div>
                    </div>
                    <div class="col-md-12 form-group">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="shipto">
                            <label class="custom-control-label" for="shipto"  data-toggle="collapse" data-target="#shipping-address">Ship to different address</label>
                        </div>
                    </div> -->
                </div>
            </div>
          
        </div>
        <div class="col-lg-4">
            <div class="card border-secondary mb-5">
                <div class="card-header bg-secondary border-0">
                  <h4 class="font-weight-semi-bold m-0">Order Total</h4>
                </div>
                <div class="card-body">
                  <h5 class="font-weight-medium mb-3">Products</h5>
                  <!-- Loop through cartData array and display product details -->
                  <ng-container *ngFor="let item of cartData">
                    <div class="d-flex justify-content-between">
                      <p>{{ item.name }}</p>
                      <p>${{ item.total_price }}</p>
                    </div>
                  </ng-container>
                  <hr class="mt-0">
                  <!-- Calculate and display Subtotal -->
                  <div class="d-flex justify-content-between mb-3 pt-1">
                    <h6 class="font-weight-medium">Subtotal</h6>
                    <h6 class="font-weight-medium">${{ calculateSubtotal() }}</h6>
                   
                  </div>
                  <!-- Static shipping cost -->
                  <div class="d-flex justify-content-between">
                    <h6 class="font-weight-medium">Shipping</h6>
                    <h6 class="font-weight-medium">$10</h6>
                  </div>
                </div>
                <div class="card-footer border-secondary bg-transparent">
                  <!-- Display calculated Total -->
                  <div class="d-flex justify-content-between mt-2">
                    <h5 class="font-weight-bold">Total</h5>
                    <h5 class="font-weight-bold">${{ calculateTotal() }}</h5>
                   
                  </div>
                </div>
              </div>
            <div class="card border-secondary mb-5">
                <div class="card-header bg-secondary border-0">
                    <h4 class="font-weight-semi-bold m-0">Payment</h4>
                </div>
                <div class="card-body">
                    <div class="form-group">
                      <div class="custom-control custom-radio">
                        <input type="radio" class="custom-control-input" [(ngModel)]="payment" name="payment" id="paypal" value="Paypal">
                        <label class="custom-control-label" for="paypal">Paypal</label>
                      </div>
                    </div>
                    <div class="form-group">
                      <div class="custom-control custom-radio">
                        <input type="radio" class="custom-control-input" [(ngModel)]="payment" name="payment" id="directcheck" value="Direct Check">
                        <label class="custom-control-label" for="directcheck">Direct Check</label>
                      </div>
                    </div>
                    <div class="form-group">
                      <div class="custom-control custom-radio">
                        <input type="radio" class="custom-control-input" [(ngModel)]="payment" name="payment" id="banktransfer" value="Bank Transfer">
                        <label class="custom-control-label" for="banktransfer">Bank Transfer</label>
                      </div>
                    </div>
                  </div>
                <div class="card-footer border-secondary bg-transparent">
                    <button  type="submit" class="btn btn-lg btn-block btn-primary font-weight-bold my-3 py-3">Place Order</button>
                </div>
            </div>
        </div>
    </div>
</form>


<app-footer></app-footer>
