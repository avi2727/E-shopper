
<div class="container-fluid pt-4 px-4">
    <div class="bg-light text-center rounded p-4">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h6 class="mb-0">User Details</h6>
      
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addmodal">Add User</button>
      </div>
      <div class="table-responsive">
        <table class="table text-start align-middle table-bordered table-hover mb-0">
          <thead>
            <tr class="text-dark">
              <!-- <th scope="col"><input class="form-check-input" type="checkbox"></th> -->
              <!-- <th scope="col">Image</th> -->
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <!-- <th scope="col">Contact</th> -->
              <!-- <th scope="col">Action</th> -->
            </tr>
          </thead>
          <tbody>
            <tr>

            <tr *ngFor="let st of studentData">
              <!-- <td><img [src]="'http://127.0.0.1/laravel-angular/public/'+ st.user_image" alt="" width="50"
                  height="50"></td> -->
              <td>{{st.name}}</td>
              <td>{{st.email}}</td>
              <!-- <td>{{st.contact}}</td> -->
              <!-- <td> -->
                <!-- Button to open the modal for editing -->
                <!-- <button type="button" class="btn btn-sm btn-primary editbtn" data-bs-toggle="modal"
                  (click)="populateFormWithData(st)" data-bs-target="#exampleModal">
                  <i class="fa fa-edit"></i>
                </button>

                <button class="btn btn-sm btn-danger" (click)="deletedata(st.id)">
                  <i class="fa fa-trash"></i>
                </button> -->
              <!-- </td> -->
             
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Update Student Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="profileForm">
            <input type="hidden" class="form-control" formControlName="id">
            <label for="first-name">Name: </label>
            <input class="form-control" type="text" formControlName="name"><br>
            <label for="last-name">Email:</label>
            <input type="text" class="form-control" formControlName="email"><br>
            <label for="last-name">Contact:</label>
            <input type="text" class="form-control" formControlName="contact"><br>
            <label for="last-name">Image:</label>
            <img [src]="imagePreview_show" style="width: 50px; height: 50px; margin-bottom: 8px; margin-left: 7px;"
              *ngIf="imagePreview_show">
            <input type="file" (change)="handleImageChange_new($event)" class="form-control" name="image"
              accept="image/*" required>
          </form>
        </div>
      
          <div class="savechangebtn">
            <button type="button" class="btn btn-sm btn-primary" data-bs-dismiss="modal" (click)="saveModifyData()">Save
              changes</button>
        </div>
      </div>
    </div>
  </div>


  <div class="modal fade" id="addmodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Add Student Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form #userForm="ngForm" (ngSubmit)="addstudent()">
            <div class="mb-3 mt-3">
              <label for="name" class="form-label">Name:</label>
              <input type="text" #userName="ngModel" class="form-control" placeholder="Enter Name" name="name"
                [(ngModel)]="userobj.name" required>
              <span *ngIf="userName.invalid && userName.touched && !userForm.submitted" style="color:red;">Please Enter
                a valid Name</span>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input type="email" #email="ngModel" class="form-control" id="email" placeholder="Enter email"
                name="email" [(ngModel)]="userobj.email" required>
              <span *ngIf="email.invalid && email.touched && !userForm.submitted" style="color:red;">Please Enter a
                valid Email</span>
            </div>
            <div class="mb-3">
              <label for="contact" class="form-label">Contact:</label>
              <input type="text" #contact="ngModel" class="form-control" id="contact" placeholder="Enter contact"
                name="contact" [(ngModel)]="userobj.contact" required pattern="[0-9]+$">
              <span *ngIf="contact.invalid && contact.touched && !userForm.submitted" style="color:red;">Please Enter a
                valid contact</span>
            </div>

            <!-- Image field -->
            <div class="mb-3">
              <label for="image" class="form-label">Image:</label>
              <img [src]="imagePreview" style="width: 50px; height: 50px; margin-bottom: 8px; margin-left:7px" alt="..."
                *ngIf="imagePreview">
              <input type="file" #userImage (change)="handleImageChange($event)" class="form-control" name="image"
                accept="image/*" required>

            </div>
            <div class="mb-3 submit-btn">
            <button class="btn btn-sm btn-primary" data-bs-dismiss="modal">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
