<!-- Page Header Start -->
 <div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 150px">
        <h1 class="font-weight-semi-bold text-uppercase mb-3">Product Details</h1>
        <div class="d-inline-flex">
            <p class="m-0"><a href="">Home</a></p>
            <p class="m-0 px-2">-</p>
            <p class="m-0">Product Details</p>
            
        </div>
    </div>
</div>
<!-- Page Header End -->

<div class="show-msg" style="background-color: none;" [innerHTML]="target"></div>
<!-- Shop Detail Start -->
<div class="container-fluid py-5">
    <div class="row px-xl-5">
        <div class="col-lg-5 pb-5">
            <!-- <div id="product-carousel" class="carousel slide" data-ride="carousel">

            <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img class="detail-img" *ngIf="productData" [src]="productData[0].product_image.startsWith('http') ? productData[0].product_image : 'http://127.0.0.1/eshopper/backend/public/'+ productData[0].product_image" alt="Image">
                  </div>
                </div>
                <!-- <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button> -->
              </div>
        </div>

        <div class="col-lg-7 pb-5">
            <h3 class="font-weight-semi-bold" *ngIf="productData">{{ productData[0].name }}</h3>
            <div class="d-flex mb-3">
                <div class="text-primary mr-2">
                    <small class="fa fa-star"></small>
                    <small class="fa fa-star"></small>
                    <small class="fa fa-star"></small>
                    <small class="fa fa-star"></small>
                    <small class="fa fa-star-half"></small>
                </div>
                <small class="pt-1">(50 Reviews)</small>
            </div>
            <h3 class="font-weight-semi-bold mb-4" *ngIf="productData">${{ productData[0].price }}</h3>
            <p class="mb-4" *ngIf="productData">{{ productData[0].description }}.</p>
            <div class="d-flex mb-3">
                <p class="text-dark font-weight-medium mb-0 mr-3">Sizes:</p>
    
                    <div class="custom-control custom-radio custom-control-inline">
                      <input type="radio" class="custom-control-input" id="size-2" name="size" *ngIf="productData" [checked]="productData[0].size === 'Small'">
                      <label class="custom-control-label" for="size-2">S</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                      <input type="radio" class="custom-control-input" id="size-3" name="size" *ngIf="productData" [checked]="productData[0].size === 'Medium'">
                      <label class="custom-control-label" for="size-3">M</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                      <input type="radio" class="custom-control-input" id="size-4" name="size"  *ngIf="productData" [checked]="productData[0].size === 'Large'">
                      <label class="custom-control-label" for="size-4">L</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                      <input type="radio" class="custom-control-input" id="size-5" name="size" *ngIf="productData" [checked]="productData[0].size === 'Extra Large'">
                      <label class="custom-control-label" for="size-5">XL</label>
                    </div>
                  
            </div>
            <div class="d-flex mb-4">
                <p class="text-dark font-weight-medium mb-0 mr-3">Colors:</p>
                
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" class="custom-control-input" id="color-1" name="color" *ngIf="productData" [checked]="productData[0].color === 'black'">
                        <label class="custom-control-label" for="color-1">Black</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" class="custom-control-input" id="color-2" name="color" *ngIf="productData" [checked]="productData[0].color === 'white'">
                        <label class="custom-control-label" for="color-2">White</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" class="custom-control-input" id="color-3" name="color" *ngIf="productData" [checked]="productData[0].color === 'red'">
                        <label class="custom-control-label" for="color-3">Red</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" class="custom-control-input" id="color-4" name="color" *ngIf="productData" [checked]="productData[0].color === 'blue'">
                        <label class="custom-control-label" for="color-4">Blue</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" class="custom-control-input" id="color-5" name="color" *ngIf="productData" [checked]="productData[0].color === 'green'">
                        <label class="custom-control-label" for="color-5">Green</label>
                    </div>
               
            </div>
            <div class="d-flex align-items-center mb-4 pt-2">
                <div class="input-group quantity mr-3" style="width: 130px;">
                    <div class="input-group-btn">
                        <button class="btn btn-primary btn-minus" (click)="decreaseQuantity()">
                            <i class="fa fa-minus"></i>
                        </button>
                    </div>
                    <input type="text" class="form-control bg-secondary text-center" [value]="quantity">
                    <div class="input-group-btn">
                        <button class="btn btn-primary btn-plus" (click)="increaseQuantity()">
                            <i class="fa fa-plus"></i>
                        </button>
                    </div>
                </div>
                <form >
                    <input type="hidden" class="form-control bg-secondary text-center" [value]="quantity">
                    <input type="hidden" class="form-control" *ngIf="productData" [value]="productData[0].id">
                    <button class="btn btn-primary px-3" (click)="addToCart()"><i class="fa fa-shopping-cart mr-1"></i> Add To Cart</button>
                </form>
                
                <!-- <button class="btn btn-primary px-3" [routerLink]="['/cart']" (click)="addtoCart()"><i class="fa fa-shopping-cart mr-1"></i> Add To Cart</button> -->
            </div>
        
            <div class="d-flex pt-2">
                <p class="text-dark font-weight-medium mb-0 mr-2">Share on:</p>
                <div class="d-inline-flex">
                    <a class="text-dark px-2" href="">
                        <i class="fa fa-facebook-f"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fa fa-twitter"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fa fa-linkedin"></i>
                    </a>
                    <a class="text-dark px-2" href="">
                        <i class="fa fa-pinterest"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <app-detail-tab-panel *ngIf="productData" [id]="productData[0]?.id"></app-detail-tab-panel>

</div>

<app-footer></app-footer>
