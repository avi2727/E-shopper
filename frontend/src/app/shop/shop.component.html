<app-header></app-header>
<div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 150px">
        <h1 class="font-weight-semi-bold text-uppercase mb-3">Our Shop</h1>
        <div class="d-inline-flex">
            <p class="m-0"><a href="">Home</a></p>
            <p class="m-0 px-2">-</p>
            <p class="m-0">Shop</p>
        </div>
    </div>
</div>
<!-- Page Header End -->

<!-- {{categoryWiseData[id]}} -->
<!-- Shop Start -->
<div class="container-fluid pt-5">
    <div class="row px-xl-5">
        <!-- Shop Sidebar Start -->
        <div class="col-lg-3 col-md-12">
            <!-- Price Start -->
            <div class="border-bottom mb-4 pb-4">
                <h5 class="font-weight-semi-bold mb-4">Filter by price</h5>
                <form>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" checked id="price-all" name="price"  value="all" (change)="filterProducts()">
                        <label class="custom-control-label" for="price-all">All Price</label>
                      </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                      <input type="radio" class="custom-control-input" id="price-1" name="price" value="0-100" (change)="filterProducts()">
                      <label class="custom-control-label" for="price-1">$0 - $100</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                      <input type="radio" class="custom-control-input" id="price-2" name="price" value="100-200" (change)="filterProducts()">
                      <label class="custom-control-label" for="price-2">$100 - $200</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                      <input type="radio" class="custom-control-input" id="price-3" name="price" value="200-300" (change)="filterProducts()">
                      <label class="custom-control-label" for="price-3">$200 - $300</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                      <input type="radio" class="custom-control-input" id="price-4" name="price" value="300-400" (change)="filterProducts()">
                      <label class="custom-control-label" for="price-4">$300 - $400</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between">
                      <input type="radio" class="custom-control-input" id="price-5" name="price" value="400-500" (change)="filterProducts()">
                      <label class="custom-control-label" for="price-5">$400 - $500</label>
                    </div>
                  </form>
                
            </div>
            <!-- Price End -->
            
            <!-- Color Start -->
            <div class="border-bottom mb-4 pb-4">
                <h5 class="font-weight-semi-bold mb-4">Filter by color</h5>
                <form>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" checked id="color-all" value="all" (change)="filterProducts()" name="color">
                        <label class="custom-control-label" for="color-all">All Color</label>
                        
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" id="color-1" name="color" value="black" (change)="filterProducts()">
                        <label class="custom-control-label" for="color-1">Black</label>
                       
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" id="color-2" name="color" value="white" (change)="filterProducts()">
                        <label class="custom-control-label" for="color-2">White</label>
                       
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" id="color-3" name="color"value="red" (change)="filterProducts()">
                        <label class="custom-control-label" for="color-3">Red</label>
                     
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" id="color-4" name="color" value="blue" (change)="filterProducts()">
                        <label class="custom-control-label" for="color-4">Blue</label>
                      
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between">
                        <input type="radio" class="custom-control-input" id="color-5" name="color" value="green" (change)="filterProducts()">
                        <label class="custom-control-label" for="color-5">Green</label>
                      
                    </div>
                </form>
                
            </div>
            <!-- Color End -->

            <!-- Size Start -->
            <div class="mb-5">
                <h5 class="font-weight-semi-bold mb-4">Filter by size</h5>
                <form>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" name="size" checked id="size-all" value="all" (change)="filterProducts()">
                        <label class="custom-control-label" for="size-all">All Size</label>
                    </div>
                
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" name="size" id="size-2" value="Small" (change)="filterProducts()">
                        <label class="custom-control-label" for="size-2">S</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" name="size" id="size-3" value="Medium" (change)="filterProducts()">
                        <label class="custom-control-label" for="size-3">M</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between mb-3">
                        <input type="radio" class="custom-control-input" name="size" id="size-4" value="Large" (change)="filterProducts()">
                        <label class="custom-control-label" for="size-4">L</label>
                    </div>
                    <div class="custom-control custom-radio d-flex align-items-center justify-content-between">
                        <input type="radio" class="custom-control-input" name="size" id="size-5" value="extra large" (change)="filterProducts()">
                        <label class="custom-control-label" for="size-5">XL</label>
                    </div>
                </form>
                
            </div>
            <!-- Size End -->
        </div>
        <!-- Shop Sidebar End -->


        <!-- Shop Product Start -->
        <div class="col-lg-9 col-md-12">
            <div class="row pb-3">
                <div class="col-12 pb-1">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <form action="">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Search by name">
                                <div class="input-group-append">
                                    <span class="input-group-text bg-transparent text-primary">
                                        <i class="fa fa-search"></i>
                                    </span>
                                </div>
                            </div>
                        </form>
                        <div class="dropdown ml-4">
                            <button class="btn border dropdown-toggle" type="button" id="triggerId" data-toggle="dropdown" aria-haspopup="true"
                                    aria-expanded="false">
                                        Sort by
                                    </button>
                            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="triggerId">
                                <a class="dropdown-item" href="#">Latest</a>
                                <a class="dropdown-item" href="#">Popularity</a>
                                <a class="dropdown-item" href="#">Best Rating</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="show-msg" style="background-color: none;" [innerHTML]="target"></div>
                <!-- nnnnnnnnn -->
                 <ng-container *ngIf="showCategoryData; else showFilterData" >
                    <!-- <div class="col-lg-3 col-md-6 col-sm-12 pb-1 btnhide" *ngFor="let st of categoryWiseData">

                    </div> -->
                  </ng-container> 
                  
                  <ng-template #showFilterData>
                    <div class="col-lg-3 col-md-6 col-sm-12 pb-1" *ngFor="let st of filterData">
                        <div class="card product-item border-0 mb-4">
                            <div class="card-header product-img position-relative overflow-hidden bg-transparent border p-0">
                                <img [routerLink]="['/detail', st.id]" [src]="st.product_image.startsWith('http') ? st.product_image : 'http://127.0.0.1/eshopper/backend/public/'+ st.product_image" class="img-fluid w-100" alt="">
                            </div>
                            <div class="card-body border-left border-right text-center p-0 pt-4 pb-3">
                                <h6 class="text-truncate mb-3">{{st.name}}</h6>
                                <div class="d-flex justify-content-center">
                                    <h6>${{st.price}}</h6><h6 class="text-muted ml-2"><del>$123.00</del></h6>
                                </div>
                            </div>
                            <div class="card-footer d-flex justify-content-between bg-light border">
                                <a [routerLink]="['/detail', st.id]" class="btn btn-sm text-dark p-0"><i class="fa fa-eye text-primary mr-1"></i>View Detail</a>
                                <a (click)="addToCart(st.id)" class="btn btn-sm text-dark p-0"><i class="fa fa-shopping-cart text-primary mr-1"></i>Add To Cart</a>
                            </div>
                        </div>
                      
                </div>
                
            </ng-template>

                    <nav aria-label="Page navigation">

                    </nav>
                </div>  -->
            </div>
        </div>
        <!-- Shop Product End -->
    </div>
</div>
